services:
  db:
    image: mysql:8.0
    container_name: amigogasto_mysql
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: amigogasto_db
      MYSQL_USER: amigouser
      MYSQL_PASSWORD: amigopassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - amigogasto_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: amigogasto_phpmyadmin
    restart: no
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - amigogasto_network

volumes:
  mysql_data:
    driver: local

networks:
  amigogasto_network:
    driver: bridge
